name: Agentic Follow-up Cron Engine (DB Polling)

on:
  # 定时由 Cloudflare Worker 触发 workflow_dispatch（见 cloudflare-worker/）
  # GHA 原生 schedule 在免费 tier 易延迟/漏跑，已移除
  workflow_dispatch:

# 避免上一轮还没跑完就被下一轮重叠触发
concurrency:
  group: agent-cron
  cancel-in-progress: false

jobs:
  poll-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -e packages/aol    # aol 包（含 pymongo / libsql-client / openai 等依赖）

      - name: Execute Incremental Agent
        env:
          # Bootstrap only — business config lives in Turso runtime_config (v0.4.2+)
          TRACKING_SOURCE: ${{ vars.TRACKING_SOURCE || 'cloud' }}
          AOL_TABLE_PREFIX: ${{ vars.AOL_TABLE_PREFIX || 'aol_' }}
          TURSO_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AOL_CONFIG_ENCRYPTION_KEY: ${{ secrets.AOL_CONFIG_ENCRYPTION_KEY }}
          # Emergency fallback: set vars.CONFIG_FALLBACK_ENV=true and restore legacy env vars
          CONFIG_FALLBACK_ENV: ${{ vars.CONFIG_FALLBACK_ENV || 'false' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          FSM_SOURCE: ${{ vars.FSM_SOURCE || 'mongo' }}
          FSM_MONGO_URL: ${{ secrets.FSM_MONGO_URL }}
          FSM_MONGO_DB: ${{ vars.FSM_MONGO_DB || 'xlinkdemo' }}
          FSM_TIME_FIELD: ${{ vars.FSM_TIME_FIELD || 'updateTime' }}
          FSM_EVENT_STATUSES: ${{ vars.FSM_EVENT_STATUSES || '206' }}
          FSM_MAX_AGE_DAYS: ${{ vars.FSM_MAX_AGE_DAYS || '14' }}
          FSM_STALE_DAYS: ${{ vars.FSM_STALE_DAYS || '0' }}
          FSM_BATCH_LIMIT: ${{ vars.FSM_BATCH_LIMIT || '50' }}
          FSM_PILOT_HOUSEKEEPERS: ${{ vars.FSM_PILOT_HOUSEKEEPERS }}
          FSM_PILOT_HOUSEKEEPER_IDS: ${{ vars.FSM_PILOT_HOUSEKEEPER_IDS }}
          AGENT_MODE: ${{ vars.AGENT_MODE || 'steps' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'hunyuan' }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'hunyuan-lite' }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECOM_WEBHOOK_MAP: ${{ vars.WECOM_WEBHOOK_MAP }}
          CONSOLE_BASE_URL: ${{ vars.CONSOLE_BASE_URL || 'https://console-sunye.vercel.app' }}
          REANALYZE_ENABLED: ${{ vars.REANALYZE_ENABLED || 'true' }}
          REANALYZE_INTERVAL_DAYS: ${{ vars.REANALYZE_INTERVAL_DAYS || '3' }}
          REANALYZE_STALE_STEP_DAYS: ${{ vars.REANALYZE_STALE_STEP_DAYS || '7' }}
          REANALYZE_MAX_PER_RUN: ${{ vars.REANALYZE_MAX_PER_RUN || '10' }}
          REANALYZE_PUSH: ${{ vars.REANALYZE_PUSH || 'true' }}
          REANALYZE_PUSH_ON_SAME_PRIORITY: ${{ vars.REANALYZE_PUSH_ON_SAME_PRIORITY || 'false' }}
        run: |
          python run_cron.py
